name: PhishShield CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py detector.py database.py dataset_builder.py train_models.py train_model.py
      - run: python -m unittest discover -s tests -v
